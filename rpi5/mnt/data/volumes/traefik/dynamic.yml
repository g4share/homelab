http:
  routers:
    forward:
      rule: 'Host(`jelly.{{ env "domain_name" }}`)'
      service: jellyfin
      entryPoints:
        - websecure
      tls: {}

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: http://10.0.0.10:8096

tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: le
        domain:
          main: '{{ env "domain_name" }}'
          sans:
            - '*.{{ env "domain_name" }}'
